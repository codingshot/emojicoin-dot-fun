---
# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: verify-doc-site-build.yaml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-docs:
    timeout-minutes: 60
    defaults:
      run:
        working-directory: 'doc/doc-site'
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v4'
    - uses: 'actions/setup-node@v3'
      with:
        node-version: 20
    - uses: 'pnpm/action-setup@v4'
    - run: 'pnpm install --frozen-lockfile'
    - run: 'pnpm build'
name: 'Verify docs site build'
'on':
  pull_request:
    branches:
    - 'main'
    - 'production'
    paths:
    - 'doc/doc-site/**'
    - '.github/workflows/verify-doc-site-build.yaml'
  workflow_dispatch: null
...
