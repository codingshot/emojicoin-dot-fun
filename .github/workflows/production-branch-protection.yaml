# yamllint disable rule:empty-lines rule:key-ordering
---
name: 'Production Branch Protection'

"on":
  pull_request:
    types:
    - 'opened'
    - 'reopened'
    - 'synchronize'
    - 'edited'

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: production-branch-protection.yaml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  production-branch-protection:
    timeout-minutes: 60
    runs-on: 'ubuntu-latest'
    steps:
    - name: 'Check if the PR is targeting the production branch'
      id: 'check_branch'
      if: |
        github.base_ref == 'production' && github.head_ref != 'main'
      run: |
        echo ERROR: You can only merge to the production branch from main.
        exit 1
...
