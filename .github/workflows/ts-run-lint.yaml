---
env:
  TS_DIR: 'src/typescript'
# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: ts-run-lint.yaml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ts-run-lint:
    timeout-minutes: 60
    runs-on: 'ubuntu-latest'
    steps:
    - uses: 'actions/checkout@v4'
    - uses: './.github/actions/ts-run-lint'
name: 'Run the TypeScript linter'
'on':
  pull_request: null
  push:
    branches:
    - 'main'
    - 'production'
  workflow_dispatch: null
...
